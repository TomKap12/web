<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tkap.cz - Připravujeme</title>
    <style>
        /* Základní nastavení stránky */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        /* Obal pro obsah */
        .container {
            background: white;
            padding: 50px 70px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 90%;
        }

        /* Nadpisy a texty */
        h1 {
            font-size: 3rem;
            margin: 0 0 15px 0;
            color: #2c3e50;
            letter-spacing: 2px;
        }

        .domain {
            color: #3498db;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin: 0 0 10px 0;
            color: #666;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        /* Responzivita pro menší obrazovky */
        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 2rem;
            }
            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🚀</div>
        <h1><span class="domain">tkap.cz</span></h1>
        <p>Na této doméně se aktuálně pracuje.</p>
        <p>Do budoucna pro vás chystáme nový projekt. Zastavte se později!</p>
    </div>

</body>
</html>
